<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReplyAI Keyboard - Live AI Mobile Keyboard</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <!-- Google Fonts for English and Bengali -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Puter.js v2 Library for Free Client-side AI Calls -->
  <script src="https://js.puter.com/v2/"></script>

  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel CDN for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      font-family: 'Hind Siliguri', 'Inter', sans-serif;
      touch-action: manipulation;
    }
    .custom-scrollbar::-webkit-scrollbar {
      height: 4px;
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.4);
      border-radius: 9999px;
    }
    .key-press-effect:active {
      transform: scale(0.93);
      filter: brightness(0.9);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- ICONS ---
    const IconSparkles = ({ size = 18 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/></svg>;
    const IconGlobe = ({ size = 18 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>;
    const IconKey = ({ size = 18 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21 2-2 2m-1.5 1.5L16 7v3h-3l-2 2h-3l-2-2H3v-3l7-7Z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/></svg>;
    const IconSend = ({ size = 18 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>;
    const IconCopy = ({ size = 18 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>;
    const IconCheck = ({ size = 18 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>;

    // BANGLISH TRANSLITERATION DICTIONARY
    const BANGLISH_MAP = {
      "ami": "আমি", "tumi": "তুমি", "se": "সে", "apni": "আপনি",
      "kemon": "কেমন", "acho": "আছো", "achen": "আছেন", "valo": "ভালো",
      "achi": "আছি", "school": "স্কুল", "e": "এ", "jabo": "যাব",
      "ajke": "আজকে", "kal": "কাল", "ki": "কী", "na": "না", "ha": "হ্যাঁ",
      "dhanyabad": "ধন্যবাদ", "bhalobashi": "ভালোবাসি", "bhai": "ভাই",
      "bondhu": "বন্ধু", "kothay": "কোথায়", "shundor": "সুন্দর", "khub": "খুব"
    };

    function App() {
      const [viewMode, setViewMode] = useState('simulator'); 
      const [currentInput, setCurrentInput] = useState('');
      const [receivedMsg, setReceivedMsg] = useState('Your job application has been shortlisted. Please reply with your availability.');
      const [chatMessages, setChatMessages] = useState([
        { id: 1, sender: 'them', text: 'Your job application has been shortlisted. Please reply with your availability.' }
      ]);

      // KEYBOARD STATE
      const [isShift, setIsShift] = useState(false);
      const [selectedLanguage, setSelectedLanguage] = useState('BNG'); 
      
      // AI & API KEY STATE
      const [aiProvider, setAiProvider] = useState(localStorage.getItem('replyai_provider') || 'Gemini');
      const [apiKey, setApiKey] = useState(localStorage.getItem('replyai_apikey') || '');
      const [savedKeyMsg, setSavedKeyMsg] = useState(false);

      const [activeAiTab, setActiveAiTab] = useState('reply');
      const [aiTone, setAiTone] = useState('Professional');
      const [aiSuggestions, setAiSuggestions] = useState([]);
      const [aiLoading, setAiLoading] = useState(false);
      const [aiError, setAiError] = useState(null);

      // PASTE FROM CLIPBOARD HANDLER
      const handlePasteClipboard = async () => {
        try {
          if (navigator.clipboard && navigator.clipboard.readText) {
            const text = await navigator.clipboard.readText();
            if (text) {
              setReceivedMsg(text);
              fetchRealAiReply(text, aiTone, activeAiTab || 'reply');
            }
          } else {
            const pasted = prompt("কপি করা মেসেজটি নিচে পেস্ট করুন (Paste copied message):");
            if (pasted) {
              setReceivedMsg(pasted);
              fetchRealAiReply(pasted, aiTone, activeAiTab || 'reply');
            }
          }
        } catch (err) {
          const pasted = prompt("কপি করা মেসেজটি নিচে পেস্ট (Paste) করুন:");
          if (pasted) {
            setReceivedMsg(pasted);
            fetchRealAiReply(pasted, aiTone, activeAiTab || 'reply');
          }
        }
      };

      // SAVE API KEY LOCALLY
      const handleSaveApiKey = (e) => {
        if (e) e.preventDefault();
        localStorage.setItem('replyai_provider', aiProvider);
        localStorage.setItem('replyai_apikey', apiKey);
        setSavedKeyMsg(true);
        setTimeout(() => setSavedKeyMsg(false), 2500);
      };

      // REAL AI FETCH ENGINE (GEMINI, PUTER JS, AND OPENAI)
      const fetchRealAiReply = async (customText, tone, mode = 'reply') => {
        const textToProcess = (typeof customText === 'string' && customText.trim()) ? customText : (receivedMsg || currentInput || 'Hello');
        
        setAiLoading(true);
        setAiError(null);
        setAiSuggestions([]);

        try {
          if (aiProvider === 'Gemini') {
            const keyToUse = apiKey || ''; 
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${keyToUse}`;

            let prompt = "";
            if (mode === 'reply') {
              prompt = `You are a smart AI mobile keyboard assistant. The user received this message from someone: "${textToProcess}". Generate 3 helpful, natural, context-aware reply options that the user can directly send back. Match the language of the message (if Bengali write Bengali, if English write English). Tone: ${tone}. Output ONLY a raw JSON array of 3 strings like ["reply 1", "reply 2", "reply 3"] without any markdown formatting or extra commentary.`;
            } else if (mode === 'rewrite') {
              prompt = `Rewrite the following text in a ${tone} tone: "${textToProcess}". Output 3 distinct natural variations as a raw JSON array of 3 strings.`;
            } else if (mode === 'grammar') {
              prompt = `Fix all grammar, spelling, and phrasing errors in this text: "${textToProcess}". Return 3 improved options as a raw JSON array of 3 strings.`;
            } else if (mode === 'translate') {
              prompt = `Translate this text to ${selectedLanguage === 'BNG' ? 'Bengali' : 'English'}: "${textToProcess}". Provide 3 natural translation options as a raw JSON array of 3 strings.`;
            }

            const response = await fetch(apiUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });

            if (!response.ok) {
              const errData = await response.json().catch(() => ({}));
              throw new Error(errData.error?.message || `Gemini API Call Failed (Status ${response.status})`);
            }

            const data = await response.json();
            const textOutput = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
            let parsed = [];
            try {
              const cleanJson = textOutput.replace(/```json|```/g, '').trim();
              parsed = JSON.parse(cleanJson);
            } catch (e) {
              parsed = textOutput.split('\n').map(l => l.replace(/^[0-9+.\-\s"]+/, '').replace(/"$/, '').trim()).filter(l => l.length > 0);
            }

            setAiSuggestions(Array.isArray(parsed) && parsed.length > 0 ? parsed.slice(0, 3) : [textOutput]);

          } else if (aiProvider === 'Puter') {
            if (!window.puter || !window.puter.ai) {
              throw new Error("Puter JS Library unavailable.");
            }

            let prompt = `Generate 3 short, smart reply options for this received message: "${textToProcess}". Tone: ${tone}. Output raw JSON array of 3 strings.`;
            const response = await window.puter.ai.chat(prompt, { model: 'gpt-4o-mini' });
            const responseText = typeof response === 'object' ? (response.message?.content || response.text || String(response)) : String(response);
            
            let parsed = [];
            try {
              const cleanJson = responseText.replace(/```json|```/g, '').trim();
              parsed = JSON.parse(cleanJson);
            } catch (e) {
              parsed = responseText.split('\n').map(l => l.replace(/^[0-9+.\-\s"]+/, '').replace(/"$/, '').trim()).filter(l => l.length > 0);
            }

            setAiSuggestions(Array.isArray(parsed) ? parsed.slice(0, 3) : [responseText]);

          } else if (aiProvider === 'OpenAI') {
            if (!apiKey) throw new Error("Please enter your OpenAI API key in settings.");

            const response = await fetch('https://api.openai.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${apiKey}`
              },
              body: JSON.stringify({
                model: 'gpt-3.5-turbo',
                messages: [
                  { role: 'system', content: `You are an AI keyboard assistant. Generate 3 short reply options for tone: ${tone}. Return ONLY a raw JSON array of 3 strings.` },
                  { role: 'user', content: `Received Message: "${textToProcess}"` }
                ],
                temperature: 0.7
              })
            });

            const data = await response.json();
            if (data.error) throw new Error(data.error.message || 'OpenAI API call failed');

            const rawContent = data.choices[0].message.content;
            let parsed = [];
            try { parsed = JSON.parse(rawContent); } catch (e) { parsed = rawContent.split('\n').filter(l => l.trim()); }
            setAiSuggestions(parsed.slice(0, 3));
          }
        } catch (err) {
          console.error("AI Generation Error:", err);
          setAiError(err.message || 'Error executing AI request.');
        } finally {
          setAiLoading(false);
        }
      };

      // KEYBOARD ACTIONS WITH NATIVE ANDROID SYSTEM INPUT BRIDGE
      const handleKeyPress = (char) => {
        let charToAdd = isShift ? char.toUpperCase() : char;
        setCurrentInput(prev => prev + charToAdd);
        if (isShift) setIsShift(false);

        if (window.AndroidKeyboard && window.AndroidKeyboard.sendKeyToSystem) {
          window.AndroidKeyboard.sendKeyToSystem(charToAdd);
        }
      };

      const handleBackspace = () => {
        setCurrentInput(prev => prev.slice(0, -1));

        if (window.AndroidKeyboard && window.AndroidKeyboard.backspace) {
          window.AndroidKeyboard.backspace();
        }
      };

      const handleSpace = () => {
        let newText = currentInput + ' ';
        if (selectedLanguage === 'BNG') {
          const words = currentInput.split(' ');
          const lastWord = words[words.length - 1].toLowerCase();
          if (BANGLISH_MAP[lastWord]) {
            words[words.length - 1] = BANGLISH_MAP[lastWord];
            newText = words.join(' ') + ' ';
          }
        }
        setCurrentInput(newText);

        if (window.AndroidKeyboard && window.AndroidKeyboard.sendKeyToSystem) {
          window.AndroidKeyboard.sendKeyToSystem(' ');
        }
      };

      const handleSendMessage = () => {
        if (!currentInput.trim()) return;
        setChatMessages(prev => [...prev, { id: Date.now(), sender: 'me', text: currentInput }]);
        setCurrentInput('');
      };

      const row1 = ['q', 'w', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p'];
      const row2 = ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l'];
      const row3 = ['z', 'x', 'c', 'v', 'b', 'n', 'm'];

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans">
          
          {/* HEADER */}
          <header className="border-b border-slate-800 bg-slate-900/90 p-3 md:p-4 flex flex-wrap justify-between items-center gap-2 sticky top-0 z-50">
            <div className="flex items-center gap-2.5">
              <div className="bg-indigo-600 p-2 rounded-xl text-white shadow-lg shadow-indigo-600/30 flex-shrink-0">
                <IconSparkles size={18} />
              </div>
              <div>
                <div className="flex items-center gap-2 flex-wrap">
                  <h1 className="font-bold text-sm md:text-base leading-tight">ReplyAI Keyboard</h1>
                  <span className={`text-[10px] px-2 py-0.5 rounded-full font-mono border ${
                    aiProvider === 'Gemini' 
                      ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' 
                      : apiKey 
                      ? 'bg-indigo-500/20 text-indigo-400 border-indigo-500/30' 
                      : 'bg-amber-500/20 text-amber-400 border-amber-500/30'
                  }`}>
                    {aiProvider === 'Gemini' ? '✨ Gemini AI (Active)' : aiProvider === 'Puter' ? '⚡ Puter AI' : `${aiProvider} Active`}
                  </span>
                </div>
                <p className="text-[11px] text-slate-400 hidden sm:block">Universal System Keyboard Integration</p>
              </div>
            </div>

            <button
              onClick={() => setViewMode(viewMode === 'simulator' ? 'dashboard' : 'simulator')}
              className="px-3 py-1.5 text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg transition flex items-center gap-1.5 shadow-md ml-auto"
            >
              {viewMode === 'simulator' ? <><IconKey size={14}/> Settings & Provider</> : 'Open Simulator'}
            </button>
          </header>

          <main className="max-w-5xl mx-auto p-4 md:p-6">
            
            {/* VIEW 1: API SETTINGS & DASHBOARD */}
            {viewMode === 'dashboard' && (
              <div className="space-y-6 max-w-2xl mx-auto">
                <form onSubmit={handleSaveApiKey} className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4 shadow-xl">
                  <h2 className="text-lg font-bold flex items-center gap-2 text-indigo-400">
                    <IconKey size={20} /> AI Engine & Provider Configuration
                  </h2>
                  <p className="text-xs text-slate-400 leading-relaxed">
                    <strong>Gemini 3 Flash</strong> অথবা <strong>Puter AI</strong> দিয়ে ফ্রিতে AI রিপ্লাই জেনারেট করতে পারবেন। এছাড়াও আপনার নিজস্ব OpenAI API Key ব্যবহার করতে পারেন।
                  </p>

                  <div className="space-y-4 pt-2">
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">Select AI Provider</label>
                      <select 
                        value={aiProvider} 
                        onChange={(e) => setAiProvider(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:border-indigo-500 outline-none"
                      >
                        <option value="Gemini">✨ Gemini 3 Flash AI (Recommended)</option>
                        <option value="Puter">⚡ Puter AI (Free Engine)</option>
                        <option value="OpenAI">OpenAI (ChatGPT API)</option>
                      </select>
                    </div>

                    {aiProvider !== 'Puter' && (
                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-1">Enter {aiProvider} API Key</label>
                        <input 
                          type="password" 
                          value={apiKey} 
                          onChange={(e) => setApiKey(e.target.value)}
                          placeholder={aiProvider === 'OpenAI' ? 'sk-proj-...' : 'AIzaSy...'}
                          className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 font-mono focus:border-indigo-500 outline-none"
                        />
                      </div>
                    )}

                    <button 
                      type="submit"
                      className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs rounded-lg transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20"
                    >
                      {savedKeyMsg ? <><IconCheck size={16}/> Settings Saved!</> : 'Save Provider Settings'}
                    </button>
                  </div>
                </form>
              </div>
            )}

            {/* VIEW 2: SIMULATOR & KEYBOARD DISPLAY */}
            {viewMode === 'simulator' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                
                {/* PHONE DISPLAY */}
                <div className="lg:col-span-7 flex flex-col items-center">
                  <div className="w-full max-w-md bg-slate-900 border-4 border-slate-800 rounded-[36px] shadow-2xl overflow-hidden flex flex-col min-h-[640px]">
                    
                    {/* TOP APP MESSAGING CONTAINER */}
                    <div className="flex-1 bg-slate-950 p-4 flex flex-col justify-between overflow-y-auto">
                      <div className="space-y-3">
                        <div className="pb-2 border-b border-slate-800 flex justify-between items-center text-xs">
                          <span className="font-semibold text-slate-300">WhatsApp / Messaging App</span>
                          <span className="text-[10px] text-emerald-400 font-mono">Simulated Target App</span>
                        </div>

                        {chatMessages.map(msg => (
                          <div key={msg.id} className={`flex ${msg.sender === 'me' ? 'justify-end' : 'justify-start'}`}>
                            <div className={`max-w-[85%] p-3 rounded-2xl text-xs leading-relaxed ${
                              msg.sender === 'me' ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-slate-800 text-slate-200 rounded-bl-none'
                            }`}>
                              {msg.text}
                              {msg.sender === 'them' && (
                                <button 
                                  onClick={() => {
                                    setReceivedMsg(msg.text);
                                    setActiveAiTab('reply');
                                    fetchRealAiReply(msg.text, aiTone, 'reply');
                                  }}
                                  className="mt-2 block text-[10px] text-indigo-400 hover:text-indigo-300 underline font-medium"
                                >
                                  ✨ Detect & Generate AI Reply
                                </button>
                              )}
                            </div>
                          </div>
                        ))}
                      </div>

                      {/* TEXT INPUT BAR */}
                      <div className="mt-4 pt-2 border-t border-slate-800 flex items-center gap-2">
                        <input
                          type="text"
                          value={currentInput}
                          onChange={(e) => setCurrentInput(e.target.value)}
                          placeholder="Type or tap keyboard keys below..."
                          className="flex-1 bg-slate-900 border border-slate-700 rounded-full px-4 py-2 text-xs text-slate-100 outline-none focus:border-indigo-500"
                        />
                        <button onClick={handleSendMessage} className="p-2 bg-indigo-600 text-white rounded-full hover:bg-indigo-500">
                          <IconSend size={14} />
                        </button>
                      </div>
                    </div>

                    {/* KEYBOARD CONTAINER */}
                    <div className="bg-slate-900 border-t border-slate-800 p-2 flex flex-col gap-1 select-none">
                      
                      {/* AI TOOLBAR */}
                      <div className="flex items-center gap-1.5 overflow-x-auto py-1 text-xs custom-scrollbar">
                        <button 
                          onClick={() => {
                            setActiveAiTab('reply');
                            fetchRealAiReply(receivedMsg, aiTone, 'reply');
                          }}
                          className={`px-3 py-1 rounded-full font-semibold flex items-center gap-1 text-[11px] whitespace-nowrap ${
                            activeAiTab === 'reply' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-indigo-400'
                          }`}
                        >
                          <IconSparkles size={12}/> AI Reply
                        </button>

                        <button 
                          onClick={() => {
                            setActiveAiTab('rewrite');
                            fetchRealAiReply(currentInput || receivedMsg, aiTone, 'rewrite');
                          }}
                          className={`px-2.5 py-1 rounded-full text-[10px] whitespace-nowrap ${
                            activeAiTab === 'rewrite' ? 'bg-indigo-600 text-white' : 'bg-slate-800/80 text-slate-300 hover:bg-slate-700'
                          }`}
                        >
                          ✍️ Rewrite
                        </button>

                        <button 
                          onClick={() => {
                            setActiveAiTab('grammar');
                            fetchRealAiReply(currentInput || receivedMsg, aiTone, 'grammar');
                          }}
                          className={`px-2.5 py-1 rounded-full text-[10px] whitespace-nowrap ${
                            activeAiTab === 'grammar' ? 'bg-indigo-600 text-white' : 'bg-slate-800/80 text-slate-300 hover:bg-slate-700'
                          }`}
                        >
                          ✔️ Fix Grammar
                        </button>

                        <button 
                          onClick={() => {
                            setActiveAiTab('translate');
                            fetchRealAiReply(currentInput || receivedMsg, aiTone, 'translate');
                          }}
                          className={`px-2.5 py-1 rounded-full text-[10px] whitespace-nowrap ${
                            activeAiTab === 'translate' ? 'bg-indigo-600 text-white' : 'bg-slate-800/80 text-slate-300 hover:bg-slate-700'
                          }`}
                        >
                          🌐 Translate
                        </button>

                        {['Professional', 'Casual', 'Friendly', 'Short'].map(tone => (
                          <button
                            key={tone}
                            onClick={() => {
                              setAiTone(tone);
                              fetchRealAiReply(receivedMsg || currentInput, tone, activeAiTab || 'reply');
                            }}
                            className={`px-2.5 py-1 rounded-full text-[10px] ${aiTone === tone ? 'bg-indigo-600/30 border border-indigo-500 text-indigo-300 font-bold' : 'bg-slate-800/60 text-slate-400'}`}
                          >
                            {tone}
                          </button>
                        ))}
                      </div>

                      {/* AI EXPANDABLE DRAWER */}
                      {activeAiTab && (
                        <div className="bg-slate-950 border border-slate-800 rounded-xl p-3 my-1 space-y-2 max-h-60 overflow-y-auto shadow-inner">
                          <div className="flex justify-between items-center text-[10px] text-slate-400">
                            <span>Mode: <strong className="text-indigo-400 uppercase">{activeAiTab}</strong> | Tone: <strong className="text-indigo-400">{aiTone}</strong></span>
                            <span>Provider: <strong className="text-emerald-400">{aiProvider}</strong></span>
                          </div>

                          {/* RECEIVED MESSAGE INPUT & CLIPBOARD PASTE */}
                          <div className="bg-slate-900 border border-indigo-500/30 rounded-lg p-2 space-y-1.5">
                            <div className="flex justify-between items-center">
                              <label className="text-[10px] font-semibold text-indigo-300 flex items-center gap-1">
                                📩 কপি করা মেসেজ (Received Message):
                              </label>
                              <button 
                                onClick={handlePasteClipboard}
                                className="px-2 py-0.5 bg-indigo-600/30 hover:bg-indigo-600/50 border border-indigo-500/40 text-indigo-200 rounded text-[10px] flex items-center gap-1 font-medium transition"
                              >
                                <IconCopy size={11} /> Paste Clipboard
                              </button>
                            </div>
                            <div className="flex gap-1.5">
                              <input 
                                type="text"
                                value={receivedMsg}
                                onChange={(e) => setReceivedMsg(e.target.value)}
                                placeholder="কপি করা মেসেজটি এখানে রাখুন..."
                                className="flex-1 bg-slate-950 border border-slate-800 rounded px-2.5 py-1 text-xs text-slate-100 outline-none focus:border-indigo-500"
                              />
                              <button 
                                onClick={() => fetchRealAiReply(receivedMsg, aiTone, activeAiTab)}
                                className="px-3 py-1 bg-indigo-600 hover:bg-indigo-500 text-white rounded text-xs font-semibold whitespace-nowrap shadow"
                              >
                                Generate
                              </button>
                            </div>
                          </div>

                          {aiLoading && (
                            <div className="flex justify-center items-center py-4 text-xs text-indigo-400 animate-pulse gap-2">
                              <IconSparkles size={16}/> Gemini AI উত্তর তৈরি করছে...
                            </div>
                          )}
                          
                          {aiError && <p className="text-xs text-rose-400 text-center py-2">{aiError}</p>}

                          {!aiLoading && !aiError && aiSuggestions.map((sug, i) => (
                            <div 
                              key={i}
                              onClick={() => {
                                setCurrentInput(sug);
                                if (window.AndroidKeyboard && window.AndroidKeyboard.sendKeyToSystem) {
                                  window.AndroidKeyboard.sendKeyToSystem(sug);
                                }
                              }}
                              className="p-2.5 bg-slate-900 border border-slate-800 hover:border-indigo-500 rounded-lg text-xs text-slate-200 cursor-pointer flex justify-between items-center group transition"
                            >
                              <span className="leading-snug pr-2">{sug}</span>
                              <span className="text-[10px] bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 px-2 py-0.5 rounded font-medium group-hover:bg-indigo-600 group-hover:text-white transition whitespace-nowrap">
                                Use Reply ↵
                              </span>
                            </div>
                          ))}
                        </div>
                      )}

                      {/* KEYBOARD KEYS */}
                      <div className="flex flex-col gap-1.5 py-1">
                        <div className="flex justify-center gap-1">
                          {row1.map(k => (
                            <button key={k} onClick={() => handleKeyPress(k)} className="flex-1 max-w-[36px] h-10 bg-slate-800 text-slate-100 font-medium text-sm rounded key-press-effect">
                              {isShift ? k.toUpperCase() : k}
                            </button>
                          ))}
                        </div>
                        <div className="flex justify-center gap-1 px-2">
                          {row2.map(k => (
                            <button key={k} onClick={() => handleKeyPress(k)} className="flex-1 max-w-[36px] h-10 bg-slate-800 text-slate-100 font-medium text-sm rounded key-press-effect">
                              {isShift ? k.toUpperCase() : k}
                            </button>
                          ))}
                        </div>
                        <div className="flex justify-center gap-1">
                          <button onClick={() => setIsShift(!isShift)} className={`w-11 h-10 rounded text-xs font-bold ${isShift ? 'bg-indigo-600' : 'bg-slate-700'}`}>⇧</button>
                          {row3.map(k => (
                            <button key={k} onClick={() => handleKeyPress(k)} className="flex-1 max-w-[36px] h-10 bg-slate-800 text-slate-100 font-medium text-sm rounded key-press-effect">
                              {isShift ? k.toUpperCase() : k}
                            </button>
                          ))}
                          <button onClick={handleBackspace} className="w-11 h-10 bg-slate-700 text-xs font-bold rounded">⌫</button>
                        </div>

                        {/* SPACE ROW */}
                        <div className="flex justify-center gap-1.5 pt-1">
                          <button onClick={() => setSelectedLanguage(selectedLanguage === 'EN' ? 'BNG' : 'EN')} className="px-2.5 h-10 bg-slate-800 text-indigo-400 text-xs rounded border border-slate-700 flex items-center gap-1">
                            <IconGlobe size={12}/> {selectedLanguage}
                          </button>
                          <button onClick={handleSpace} className="flex-1 h-10 bg-slate-800 text-slate-400 text-xs rounded font-medium">
                            {selectedLanguage === 'BNG' ? 'Banglish (Space = Bangla)' : 'Space'}
                          </button>
                          <button onClick={handleSendMessage} className="px-4 h-10 bg-indigo-600 text-white text-xs font-bold rounded">
                            Enter
                          </button>
                        </div>
                      </div>

                    </div>
                  </div>
                </div>

                {/* INSTRUCTIONS */}
                <div className="lg:col-span-5 space-y-4">
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
                    <h3 className="font-bold text-sm text-indigo-400">🇧🇩 Banglish Typing Test</h3>
                    <p className="text-xs text-slate-400">কীবোর্ডে ইংরেজি অক্ষর দিয়ে টাইপ করুন এবং Space চাপুন:</p>
                    <div className="flex gap-2 flex-wrap">
                      <button onClick={() => setCurrentInput('ami valo achi ')} className="text-xs bg-slate-800 text-slate-200 px-2.5 py-1 rounded border border-slate-700 hover:border-indigo-500">"ami valo achi"</button>
                      <button onClick={() => setCurrentInput('tumi kemon acho ')} className="text-xs bg-slate-800 text-slate-200 px-2.5 py-1 rounded border border-slate-700 hover:border-indigo-500">"tumi kemon acho"</button>
                    </div>
                  </div>
                </div>

              </div>
            )}

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
